name: Verify Linux container
on:
  push:
    branches: [dev]
    paths-ignore: ['**/*.md']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build and test production image
        run: docker build --pull --tag cdek-fm:verify .
      - name: Verify hardened runtime
        run: bash scripts/verify-container.sh cdek-fm:verify
