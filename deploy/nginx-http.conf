# Add as an independent virtual host; preserve ISPmanager's existing hosts.
server {
    listen 192.168.0.141:80;
    server_name cdek-fm.ru www.cdek-fm.ru 194.58.103.93;
    client_max_body_size 6m;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cdek-acme;
    }
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Oai-Authenticated-User-Id "";
        proxy_set_header Oai-Authenticated-User-Email "";
        proxy_set_header Oai-Authenticated-User-Full-Name "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
