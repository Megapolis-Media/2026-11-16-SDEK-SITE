name: cdek-fm
services:
  web:
    image: ${CDEK_IMAGE:?Set the immutable release image}
    restart: unless-stopped
    env_file:
      - path: runtime.env
        format: raw
    environment:
      VINEXT_TRUST_PROXY: "1"
      VINEXT_TRUSTED_HOSTS: "cdek-fm.ru,www.cdek-fm.ru"
    ports:
      - "127.0.0.1:3101:3000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1536m
    cpus: 2
    pids_limit: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
