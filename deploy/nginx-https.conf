# Activate after Certbot creates both domain certificates.
# The listen address is the server's private interface behind provider NAT.
server {
    listen 192.168.0.141:80;
    server_name 194.58.103.93;
    return 404;
}
server {
    listen 192.168.0.141:80;
    server_name cdek-fm.ru www.cdek-fm.ru;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/cdek-acme;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 192.168.0.141:443 ssl;
    http2 on;
    server_name cdek-fm.ru www.cdek-fm.ru;
    ssl_certificate /etc/letsencrypt/live/cdek-fm.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cdek-fm.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CDEKSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 6m;
    location / {
        proxy_pass http://127.0.0.1:3101;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header Oai-Authenticated-User-Id "";
        proxy_set_header Oai-Authenticated-User-Email "";
        proxy_set_header Oai-Authenticated-User-Full-Name "";
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
